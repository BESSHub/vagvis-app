name: vagvis
description: Navigation piéton et cyclable pour le Skåne — nouveaux arrivants et mobilité douce.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  mapbox_maps_flutter: ^2.2.0
  geolocator: ^12.0.0
  http: ^1.2.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
